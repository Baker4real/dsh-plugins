<!doctype html>
<html lang="zh-CN" data-windows-titlebar>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
  <title>Native titlebar regression</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    html[data-windows-titlebar] { --dsh-windows-titlebar-height: 40px; }
    .frame { box-sizing: border-box; height: 100%; position: relative; overflow: hidden; padding-top: var(--dsh-windows-titlebar-height); background: #e5e7eb; }
    .frame::before { content: ""; height: var(--dsh-windows-titlebar-height); background: #f9fafb; -webkit-app-region: drag; position: absolute; inset: 0 0 auto; }
    .center { height: 100%; transform: matrix(1, 0, 0, 1, 0, 0); background: #fff; }
    .backdrop { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.38); display: flex; justify-content: flex-end; pointer-events: auto; }
    .backdrop:popover-open { position: fixed; inset: 0; width: 100vw; height: 100vh; margin: 0; padding: 0; border: 0; max-width: none; max-height: none; background: rgba(0,0,0,.38); display: flex; justify-content: flex-end; overflow: visible; }
    .panel { height: 100%; width: min(680px, 100vw); box-sizing: border-box; display: flex; flex-direction: column; background: #fff; color: #111827; padding: 22px; gap: 14px; }
    .head { display: flex; align-items: flex-start; gap: 12px; }
    .head h2 { font-size: 20px; margin: 0; }
    .close { flex: 0 0 auto; border: 0; background: transparent; color: inherit; font-size: 26px; line-height: 24px; cursor: pointer; }
    .drag-control { position: absolute; left: 22px; top: 22px; z-index: 2; display: none; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="center">
      <div id="backdrop" class="backdrop" popover="manual">
        <section class="panel" role="dialog" aria-modal="true">
          <header class="head"><button id="close" class="close" type="button">×</button><h2>子代理管理</h2></header>
        </section>
      </div>
    </div>
    <button id="drag-control" class="close drag-control" type="button">×</button>
  </div>
  <script>document.getElementById('backdrop').showPopover()</script>
</body>
</html>
