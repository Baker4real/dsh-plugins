name: Source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check all JavaScript syntax and package manifests
        run: node scripts/check-source.mjs
      - name: Test skills root and ASAR tool guards
        working-directory: dsh-skills-root-guard
        run: node --test tests/*.test.js
      - name: Test magpie workbench with local fake services
        working-directory: dsh-gpt-image-playground-magpie
        run: node --test test/*.test.mjs
      - name: Check failure indicator build, syntax, and behavior
        working-directory: dsh-failure-status-dot
        run: node scripts/check.mjs

  devtools-tests:
    # source-nav.test.js and slot-navigation.test.js use Windows D:/ fixture roots.
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test devtools unit suite
        working-directory: dsh-progress-guard/devtools
        run: node --test tests/*.test.js

  agent-reliability-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dsh-compaction-256k/agent-reliability
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  subagent-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-subagent-ui
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - run: node --test test/smoke-runtime.test.mjs test/owned-processes.test.mjs test/verify-build.test.mjs
      - name: Verify the bundle from the monorepo commit
        run: node scripts/verify-build.mjs HEAD --max-chars 1200

  subagent-native-titlebar:
    runs-on: windows-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: dsh-subagent-ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run test:native-titlebar

  compaction-tests:
    # run-check-process.mjs kills process trees with taskkill, so its tests need Windows.
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dsh-compaction-256k
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # Plain Node skips the local-bundle-check tests, which need DSH's bundled Node and pnpm. daily-update-guards/tests
      # stays in the local check: its native preflight runs D:/Codex/.codex/scripts/Invoke-CheckedPowerShell.ps1.
      - run: node --test tests/*.test.js
